<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c7ff"/>
      <stop offset="100%" stop-color="#006dff"/>
    </linearGradient>
  </defs>

  <!-- Minimal favicon timer, transparent background -->

  <!-- Top button -->
  <rect x="205" y="18" width="102" height="62" rx="18" fill="#07111f"/>

  <!-- Side button -->
  <rect x="377" y="88" width="42" height="72" rx="12"
        transform="rotate(42 398 124)" fill="#07111f"/>

  <!-- Outer stopwatch body -->
  <circle cx="256" cy="278" r="200" fill="#07111f"/>

  <!-- Inner face -->
  <circle cx="256" cy="278" r="150" fill="#ffffff"/>

  <!-- Blue timer segment -->
  <path d="M256 278 L256 128
           A150 150 0 0 1 406 278 Z"
        fill="url(#timerBlue)"/>

  <!-- Tick marks, only 4 large marks for small favicon readability -->
  <g stroke="#07111f" stroke-width="22" stroke-linecap="round">
    <line x1="256" y1="138" x2="256" y2="170"/>
    <line x1="396" y1="278" x2="364" y2="278"/>
    <line x1="256" y1="418" x2="256" y2="386"/>
    <line x1="116" y1="278" x2="148" y2="278"/>
  </g>

  <!-- Hand -->
  <path d="M256 278 L356 188"
        stroke="#07111f"
        stroke-width="30"
        stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="278" r="32" fill="#07111f"/>
  <circle cx="256" cy="278" r="12" fill="#ffffff" opacity="0.85"/>
</svg>
